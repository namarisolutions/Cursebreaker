<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cursebreaker brand sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#E2B95C}a:hover{color:#F3D894}
</style>
</head>
<body>
<div style="width: 880px; height: 560px; box-sizing: border-box; padding: 48px 56px; background: #000000; color: #EDE6D6; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 36px">

  <div style="display: flex; align-items: center; gap: 28px">
    <svg width="112" height="112" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <g stroke="none" fill="#E2B95C"><path d="M16 45 A16 16 0 0 1 48 45 L44 45 A12 12 0 0 0 20 45 Z"></path><path d="M27.18 43.66 L22.76 41.17 L27.65 42.54 Z M28.06 41.92 L24.93 37.93 L28.92 41.06 Z M31.39 40.04 L32.00 34.00 L32.61 40.04 Z M35.08 41.06 L39.07 37.93 L35.94 41.92 Z M36.35 42.54 L41.24 41.17 L36.82 43.66 Z"></path><path d="M14.46 39.13 L7.98 35.05 L15.44 36.75 Z M18.04 32.86 L13.62 26.62 L19.86 31.04 Z M30.71 26.55 L32.00 16.00 L33.29 26.55 Z M44.14 31.04 L50.38 26.62 L45.96 32.86 Z M48.56 36.75 L56.02 35.05 L49.54 39.13 Z"></path><path d="M13 45.5 Q32 42 51 45.5 L51 52 Q32 48.5 13 52 Z"></path></g>
      <g fill="#000000" stroke="none"><circle cx="22" cy="48.3" r="1.5"></circle><circle cx="32" cy="47.6" r="1.5"></circle><circle cx="42" cy="48.3" r="1.5"></circle></g><g stroke-linecap="round" stroke-linejoin="round"><path d="M32 45 L21.67 20.06 M32 45 L42.33 20.06" stroke="#000000" stroke-width="4.6"></path><circle cx="32" cy="45" r="4" fill="#000000"></circle><path d="M32 45 L23.20 23.75 M32 45 L40.80 23.75" stroke="#E2B95C" stroke-width="2"></path><path d="M24.59 23.72 L21.67 20.06 L22.19 24.71 Z M41.81 24.71 L42.33 20.06 L39.41 23.72 Z" fill="#E2B95C" stroke="#E2B95C" stroke-width="0.6"></path><circle cx="32" cy="45" r="2.6" fill="#E2B95C"></circle><circle cx="32" cy="45" r="0.9" fill="#000000"></circle></g>    </svg>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-family: Cinzel, serif; font-weight: 700; font-size: 52px; letter-spacing: 0.16em; line-height: 1; color: #E2B95C">CURSEBREAKER</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #B8AE98">An AI to talk anything through.</div>
    </div>
  </div>

  <div style="height: 1px; background: #17140D"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="font-family: Cinzel, serif; font-size: 12px; letter-spacing: 0.2em; color: #E2B95C">PALETTE</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 64px; border-radius: 8px; background: #000000; border: 1px solid #3A3121"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B8AE98">#000000</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 64px; border-radius: 8px; background: #0B0A07; border: 1px solid #3A3121"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B8AE98">#0B0A07</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 64px; border-radius: 8px; background: #E2B95C"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B8AE98">#E2B95C</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 64px; border-radius: 8px; background: #EDE6D6"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B8AE98">#EDE6D6</span></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="font-family: Cinzel, serif; font-size: 12px; letter-spacing: 0.2em; color: #E2B95C">TYPE</div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-family: Cinzel, serif; font-weight: 700; font-size: 24px; color: #EDE6D6">Cinzel</span><span style="font-size: 12px; color: #9C927C">Wordmark &amp; headings</span></div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #EDE6D6">JetBrains Mono</span><span style="font-size: 12px; color: #9C927C">Prompt &amp; details</span></div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-family: Inter, sans-serif; font-weight: 500; font-size: 20px; color: #EDE6D6">Inter</span><span style="font-size: 12px; color: #9C927C">Interface text</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
